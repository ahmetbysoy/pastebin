<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal Paste</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #0b0e14; color: #d7dde6;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px; gap: 16px;
  }
  h1 { font-size: 18px; letter-spacing: 4px; margin: 8px 0 0; color: #7aa2f7; font-weight: 700; }
  .card {
    width: 100%; max-width: 720px; background: #111623;
    border: 1px solid #1e2530; border-radius: 10px; overflow: hidden;
  }
  textarea {
    width: 100%; min-height: 320px; resize: vertical; border: 0; outline: none;
    background: transparent; color: #d7dde6; padding: 16px;
    font: inherit; font-size: 14px; line-height: 1.55;
  }
  textarea::placeholder { color: #46536b; }
  .sizebar {
    display: flex; justify-content: space-between; padding: 8px 16px;
    border-top: 1px solid #1e2530; font-size: 12px; color: #6b7686;
  }
  .sizebar .over { color: #f7768e; font-weight: 600; }
  button.primary {
    font: inherit; font-size: 14px; letter-spacing: 2px; font-weight: 700;
    padding: 12px 28px; border-radius: 8px; cursor: pointer;
    border: 1px solid #2b3546; background: #7aa2f7; color: #0b0e14;
  }
  button.primary:disabled { opacity: .55; cursor: not-allowed; }
  .hint { font-size: 12px; color: #6b7686; }
  .status { width: 100%; max-width: 720px; min-height: 20px; font-size: 14px; text-align: center; }
  .status.error { color: #f7768e; }
  .status.success { color: #9ece6a; }
  .result {
    display: none; width: 100%; max-width: 720px; text-align: center;
    background: #111623; border: 1px solid #1e2530; border-radius: 10px; padding: 20px 16px;
  }
  .result.show { display: block; }
  .result .url {
    font-size: 15px; color: #7aa2f7; word-break: break-all; margin: 12px 0;
  }
  .result button {
    font: inherit; font-size: 13px; padding: 8px 18px; border-radius: 6px; cursor: pointer;
    border: 1px solid #2b3546; background: #151b26; color: #d7dde6;
  }
  .result .meta { font-size: 12px; color: #6b7686; margin-top: 12px; }
  a { color: #7aa2f7; }
</style>
</head>
<body>
  <h1>MINIMAL PASTE</h1>

  <div class="card">
    <textarea id="content" placeholder="Paste your text here..." spellcheck="false"></textarea>
    <div class="sizebar">
      <span id="size">0 B / 5 MB</span>
      <span>UTF-8</span>
    </div>
  </div>

  <button class="primary" id="create" type="button">CREATE PASTE</button>
  <div class="hint">Deletes automatically after 24 hours</div>
  <div class="status" id="status" role="status"></div>

  <div class="result" id="result">
    <div>PASTE CREATED</div>
    <div class="url"><a id="paste-url" href="#" target="_blank" rel="noopener"></a></div>
    <button id="copy" type="button">COPY LINK</button>
    <div class="meta" id="expires"></div>
  </div>

<script>
(function () {
  var LIMIT = 5 * 1024 * 1024; // 5 MiB, byte-based (UTF-8)
  var ta = document.getElementById('content');
  var sizeEl = document.getElementById('size');
  var btn = document.getElementById('create');
  var statusEl = document.getElementById('status');
  var resultEl = document.getElementById('result');
  var urlEl = document.getElementById('paste-url');
  var copyEl = document.getElementById('copy');
  var expiresEl = document.getElementById('expires');
  var creating = false;

  function byteSize(str) {
    try { return new Blob([str]).size; }
    catch (e) { return new TextEncoder().encode(str).length; }
  }
  function fmt(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  ta.addEventListener('input', function () {
    var n = byteSize(ta.value);
    sizeEl.innerHTML = '';
    sizeEl.textContent = fmt(n) + ' / 5 MB';
    sizeEl.classList.toggle('over', n > LIMIT);
  });

  function setState(state, msg) {
    statusEl.className = 'status ' + state;
    statusEl.textContent = msg || '';
    btn.disabled = creating || state === 'creating';
    if (state === 'creating') { btn.disabled = true; btn.textContent = 'CREATING…'; }
    else { btn.textContent = 'CREATE PASTE'; }
  }

  btn.addEventListener('click', async function () {
    if (creating) return; // anti-spam: one request at a time
    var content = ta.value;

    if (content.trim().length === 0) { setState('error', 'Paste cannot be empty.'); return; }
    var n = byteSize(content);
    if (n > LIMIT) { setState('error', 'Paste is too large. Limit is 5 MB.'); return; }

    creating = true;
    resultEl.classList.remove('show');
    setState('creating', 'Creating paste…');

    try {
      var r = await fetch('/api/paste', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ content: content }),
      });
      var data = await r.json().catch(function () { return {}; });
      if (!r.ok) {
        setState('error', (data && data.error) || 'Paste could not be created. Please try again.');
        return;
      }
      var absolute = location.origin + data.url;
      urlEl.href = absolute; urlEl.textContent = absolute;
      expiresEl.textContent = 'Expires in 24 hours' + (data.expiresAt ? ' (' + new Date(data.expiresAt).toLocaleString() + ')' : '');
      resultEl.classList.add('show');
      setState('success', 'Paste created.');
    } catch (e) {
      setState('error', 'Paste could not be created. Please try again.');
    } finally {
      creating = false;
      setState(statusEl.className.indexOf('error') >= 0 ? 'error' : 'success', statusEl.textContent);
    }
  });

  copyEl.addEventListener('click', function () {
    var url = urlEl.href;
    function done() { copyEl.textContent = 'COPIED!'; setTimeout(function () { copyEl.textContent = 'COPY LINK'; }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, fallback);
    } else fallback();
    function fallback() {
      var tmp = document.createElement('input');
      tmp.value = url; document.body.appendChild(tmp); tmp.select();
      try { document.execCommand('copy'); } catch (e) {}
      tmp.remove(); done();
    }
  });
})();
</script>
</body>
</html>
