name: Health check

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  health:
    # Runs only when SITE_URL is configured as a repository secret.
    if: ${{ secrets.SITE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/health
        run: |
          STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" "${{ secrets.SITE_URL }}/api/health")
          cat /tmp/health.json
          if [ "$STATUS" != "200" ]; then
            echo "::error::Health check failed with HTTP $STATUS"
            exit 1
          fi
